<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>多區域地圖與任務記錄系統</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #111827; /* 改為深色背景 */
      padding: 20px;
      color: #f3f4f6; /* 改為亮色文字 */
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #f9fafb; /* 標題改為亮白色 */
      margin-bottom: 25px;
    }
    
    /* 主選單群組 */
    .main-accordion {
      background: #1f2937; /* 深色卡片背景 */
      border: 1px solid #374151; /* 深色邊框 */
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      margin-bottom: 15px;
      overflow: hidden;
    }
    .main-header {
      background: #374151; /* 深色標題欄 */
      color: #f3f4f6;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }
    .main-header:hover {
      background: #4b5563; /* 懸停時稍微變亮 */
    }
    .main-content {
      display: none;
      padding: 16px;
      background: #111827; /* 內容區塊深色背景 */
    }
    .main-accordion.active > .main-content {
      display: block;
    }

    /* 座標區塊 */
    .zone-section {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 6px;
      margin-bottom: 12px;
      padding: 12px 15px;
    }
    .zone-title {
      font-size: 15px;
      font-weight: bold;
      color: #93c5fd; /* 改為柔和的亮藍色 */
      border-bottom: 2px solid #4b5563;
      padding-bottom: 6px;
      margin-bottom: 10px;
    }

    /* 建築與筆記卡片 */
    .building-card {
      background: #111827;
      border: 1px solid #374151;
      border-radius: 4px;
      margin-bottom: 8px;
      padding: 10px;
    }
    .building-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .building-title {
      font-weight: 600;
      color: #34d399; /* 改為亮眼的青綠色 */
      font-size: 14px;
    }
    .building-type-badge {
      font-size: 11px;
      background: #065f46; /* 深色徽章背景 */
      color: #6ee7b7; /* 徽章文字 */
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .notes-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .notes-group label {
      font-size: 11px;
      color: #9ca3af; /* 灰階標籤文字 */
      font-weight: bold;
    }
    .notes-input {
      width: 100%;
      height: 50px;
      padding: 6px;
      background: #1f2937; /* 輸入框深色背景 */
      color: #f3f4f6; /* 輸入框文字顏色 */
      border: 1px solid #4b5563;
      border-radius: 4px;
      resize: vertical;
      box-sizing: border-box;
      font-size: 13px;
    }
    .notes-input:focus {
      outline: none;
      border-color: #60a5fa; /* 聚焦時邊框發光變藍 */
    }
    .save-status {
      font-size: 11px;
      color: #34d399; /* 儲存成功提示改為亮綠色 */
      text-align: right;
      margin-top: 2px;
      height: 14px;
    }
    .icon {
      font-size: 14px;
    }
    .loading-text {
      text-align: center;
      color: #9ca3af;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>遊戲世界區域與任務記錄系統</h1>
    <div id="menus-root"></div>
  </div>

  <!-- 引入 Supabase SDK -->
  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

// 1. 填入您的 Supabase 設定
const SUPABASE_URL = "https://yasnbvmngdxkukuxvafc.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlhc25idm1uZ2R4a3VrdXh2YWZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4Mjc0MzUsImV4cCI6MjEwMjQwMzQzNX0.ht7XqIdRczGIdVE-oljEplFLEOHyxb7zZSI_pnDDP4w";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 2. 定義允許保留的建築類型
const allowedBuildingTypes = ["Industrial", "Apartment", "Hospital", "Police", "Office","Hotel"];

// 3. 定義各選單與其對應的座標範圍
const menuConfigs = [
  { name: "灰木鎮", startRow: 24, endRow: 24, startCol: 4, endCol: 6 },
  { name: "丹茨維爾鎮", startRow: 24, endRow: 24, startCol: 7, endCol: 12 },
  { name: "南摩赫斯特", startRow: 24, endRow: 24, startCol: 13, endCol: 15 },
  { name: "勒威伯里", startRow: 25, endRow: 27, startCol: 4, endCol: 6 },
  { name: "阿奇布魯克", startRow: 25, endRow: 27, startCol: 7, endCol: 12 },
  { name: "狼堡", startRow: 25, endRow: 27, startCol: 13, endCol: 15 },
];

async function initAllMenus() {
  const root = document.getElementById("menus-root");
  root.innerHTML = "";

  for (const config of menuConfigs) {
    const menuKey = config.name.toLowerCase().replace(/[^a-z0-9]/g, "_");

    const mainAccordion = document.createElement("div");
    mainAccordion.className = "main-accordion";

    const mainHeader = document.createElement("div");
    mainHeader.className = "main-header";
    mainHeader.innerHTML = `
      <span>🏰 ${config.name} (${config.startRow}_${config.startCol} ~ ${config.endRow}_${config.endCol})</span>
      <span class="icon">＋</span>
    `;

    const mainContent = document.createElement("div");
    mainContent.className = "main-content";
    mainContent.innerHTML = `<div class="loading-text">載入中...</div>`;

    mainAccordion.appendChild(mainHeader);
    mainAccordion.appendChild(mainContent);
    root.appendChild(mainAccordion);

    mainHeader.addEventListener("click", () => {
      const isActive = mainAccordion.classList.contains("active");
      mainAccordion.classList.toggle("active");
      mainHeader.querySelector(".icon").textContent = isActive ? "＋" : "－";
    });

    loadMenuCoordinates(config, menuKey, mainContent);
  }
}

async function loadMenuCoordinates(config, menuKey, contentContainer) {
  contentContainer.innerHTML = "";

  for (let row = config.startRow; row <= config.endRow; row++) {
    for (let col = config.startCol; col <= config.endCol; col++) {
      const zoneId = `${row}_${col}`;
      
      const zoneSection = document.createElement("div");
      zoneSection.className = "zone-section";

      const zoneTitle = document.createElement("div");
      zoneTitle.className = "zone-title";
      zoneTitle.textContent = `座標：${zoneId}`;
      zoneSection.appendChild(zoneTitle);

      // --- Supabase 查詢資料 ---
      try {
        const { data: mapData, error: mapError } = await supabase
          .from("map")
          .select("buildings")
          .eq("id", zoneId)
          .maybeSingle();

        if (mapError) throw mapError;

        if (mapData && mapData.buildings) {
          const rawBuildings = mapData.buildings;
          let parsedBuildings = [];

          if (Array.isArray(rawBuildings)) {
            parsedBuildings = rawBuildings.map(b => {
              if (typeof b === 'string') {
                const match = b.match(/^(.*?)\s*\(([^)]+)\)$/);
                if (match) return { name: match[1].trim(), type: match[2].trim() };
              }
              return null;
            }).filter(Boolean);
          }

          const filteredBuildings = parsedBuildings.filter(b => allowedBuildingTypes.includes(b.type));

          if (filteredBuildings.length === 0) {
            const emptyMsg = document.createElement("div");
            emptyMsg.style.cssText = "color: #6b7280; font-size: 13px; padding: 4px 0;";
            emptyMsg.textContent = "此座標無符合條件的建築資料";
            zoneSection.appendChild(emptyMsg);
          } else {
            for (const building of filteredBuildings) {
              const buildingName = building.name;
              const buildingType = building.type;
              const noteDocId = `${menuKey}_${zoneId}_${buildingName.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_')}`;

              const buildingCard = document.createElement("div");
              buildingCard.className = "building-card";
              buildingCard.innerHTML = `
                <div class="building-header">
                  <span class="building-title">🏢 ${buildingName}</span>
                  <span class="building-type-badge">${buildingType}</span>
                </div>
                <div class="notes-group">
                  <label>Notes (筆記):</label>
                  <textarea class="notes-input" placeholder="輸入備註，離開自動儲存..."></textarea>
                  <div class="save-status"></div>
                </div>
              `;

              const textarea = buildingCard.querySelector(".notes-input");
              const statusDiv = buildingCard.querySelector(".save-status");

              // 讀取筆記
              const { data: noteData } = await supabase
                .from("menu_notes")
                .select("note")
                .eq("id", noteDocId)
                .maybeSingle();

              if (noteData) textarea.value = noteData.note || "";

              // 儲存筆記
              textarea.addEventListener("blur", async () => {
                statusDiv.textContent = "儲存中...";
                const { error } = await supabase.from("menu_notes").upsert({
                  id: noteDocId,
                  menu: menuKey,
                  zone: zoneId,
                  building: buildingName,
                  type: buildingType,
                  note: textarea.value,
                  updatedAt: new Date().toISOString()
                });

                if (error) {
                  console.error("儲存失敗:", error);
                  statusDiv.textContent = "儲存失敗 ✕";
                } else {
                  statusDiv.textContent = "已儲存 ✓";
                  setTimeout(() => { statusDiv.textContent = ""; }, 2000);
                }
              });

              zoneSection.appendChild(buildingCard);
            }
          }
        } else {
          const notFoundMsg = document.createElement("div");
          notFoundMsg.style.cssText = "color: #6b7280; font-size: 13px; padding: 4px 0;";
          notFoundMsg.textContent = `資料庫尚無 ${zoneId} 資料`;
          zoneSection.appendChild(notFoundMsg);
        }
      } catch (err) {
        console.error(`讀取座標 ${zoneId} 失敗:`, err);
        const errMsg = document.createElement("div");
        errMsg.style.cssText = "color: #ef4444; font-size: 13px; padding: 4px 0;";
        errMsg.textContent = "讀取失敗";
        zoneSection.appendChild(errMsg);
      }

      contentContainer.appendChild(zoneSection);
    }
  }
}

initAllMenus();
  </script>

</body>
</html>
