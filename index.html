<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>遊戲任務管理儀表板</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }
  </style>
</head>
<body>

  <!-- ================= 1. 主控台頁面 (預設顯示) ================= -->
  <div id="main-dashboard-view">
    
    <!-- 頂部標題與連線狀態 -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #1f2937; padding-bottom: 12px;">
      <h1 style="margin: 0; font-size: 22px; color: #60a5fa;">🗺️ 遊戲任務與地圖管理儀表板</h1>
      <div style="font-size: 13px; color: #9ca3af;" id="sync-status">(Supabase 準備連線)</div>
    </div>

    <!-- 搜尋與過濾器工具列 -->
    <div class="search-bar-container" style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
      <input type="text" id="search" placeholder="搜尋建築、城市、類型或備註..." oninput="window.filterQuests()" style="flex: 1; min-width: 220px; padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px; font-size: 14px;" />
      
      <select id="filter-city" onchange="window.filterQuests()" style="padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px; font-size: 14px;">
        <option value="">全部城市</option>
        <option value="灰木鎮">灰木鎮</option>
        <!-- 可依需求擴充其他城市 -->
      </select>

      <select id="filter-type" onchange="window.filterQuests()" style="padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px; font-size: 14px;">
        <option value="">全部類型</option>
        <option value="Locate / Contact Person">Locate / Contact Person</option>
        <option value="Kill Boss">Kill Boss</option>
      </select>

      <select id="filter-status" onchange="window.filterQuests()" style="padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px; font-size: 14px;">
        <option value="">全部狀態</option>
        <option value="pending">⭕ 未完成</option>
        <option value="show">👁️ 顯示中</option>
        <option value="completed">✅ 已完成</option>
      </select>
    </div>

    <!-- 任務列表表格 -->
    <div style="background: #111827; border: 1px solid #1f2937; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
      <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
        <thead>
          <tr style="background: #1f2937; color: #9ca3af; border-bottom: 1px solid #374151;">
            <th style="padding: 12px 16px;">建築與路線</th>
            <th style="padding: 12px 16px;">城市</th>
            <th style="padding: 12px 16px;">類型</th>
            <th style="padding: 12px 16px;">功能操作</th>
            <th style="padding: 12px 16px; width: 130px;">狀態</th>
          </tr>
        </thead>
        <tbody id="hudTableBody">
          <!-- 任務資料將由 JavaScript 動態填入 -->
        </tbody>
      </table>
    </div>

  </div>


  <!-- ================= 2. 任務詳細編輯頁面 (預設隱藏) ================= -->
  <div id="task-edit-page-view" style="display: none; padding: 30px; background: #0b0f19; color: #f3f4f6; min-height: 100vh; max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #1f2937; padding-bottom: 12px;">
      <button onclick="window.goBackToMain()" style="background: #374151; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">← 返回任務列表</button>
      <h2 style="margin: 0; color: #60a5fa;">📝 任務詳細編輯檢視</h2>
      <div></div>
    </div>

    <input type="hidden" id="page-task-id">

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div>
        <label style="display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px;">目標建築 (Building)：</label>
        <input type="text" id="page-edit-building" style="width: 100%; padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px;">
      </div>

      <div style="display: flex; gap: 16px;">
        <div style="flex: 1;">
          <label style="display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px;">X 座標：</label>
          <input type="number" id="page-edit-xcoord" style="width: 100%; padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px;">
        </div>
        <div style="flex: 1;">
          <label style="display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px;">Y 座標：</label>
          <input type="number" id="page-edit-ycoord" style="width: 100%; padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px;">
        </div>
      </div>

      <div>
        <label style="display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px;">備註內容：</label>
        <textarea id="page-edit-notes" rows="6" style="width: 100%; padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px;"></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
        <button onclick="window.goBackToMain()" style="padding: 10px 20px; background: #4b5563; color: #fff; border: none; border-radius: 6px; cursor: pointer;">取消</button>
        <button onclick="window.saveTaskAndReturnMain()" style="padding: 10px 24px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">儲存並返回主頁</button>
      </div>
    </div>
  </div>


  <!-- ================= 3. 任務備註與歷史紀錄頁面 (預設隱藏) ================= -->
  <div id="task-notes-page-view" style="display: none; padding: 30px; background: #0b0f19; color: #f3f4f6; min-height: 100vh; max-width: 800px; margin: 0 auto;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #1f2937; padding-bottom: 12px;">
      <button onclick="window.goBackToMainFromNotes()" style="background: #374151; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer;">← 返回任務列表</button>
      <h2 style="margin: 0; color: #60a5fa;">📖 任務備註與協作記錄檢視</h2>
      <div></div>
    </div>

    <input type="hidden" id="notes-page-task-id">

    <div style="display: flex; flex-direction: column; gap: 16px;">
      <div style="background: #1f2937; padding: 12px 16px; border-radius: 6px; border: 1px solid #374151;">
        <div style="font-size: 13px; color: #9ca3af; margin-bottom: 4px;">目前檢視任務：</div>
        <div id="notes-page-quest-title" style="font-size: 16px; font-weight: bold; color: #fff;">-</div>
      </div>

      <div>
        <label style="display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px;">歷史備註與多人記錄 (Collaboration Log)：</label>
        <div id="notes-page-history-box" style="height: 220px; overflow-y: auto; background: #1f2937; padding: 12px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; color: #d1d5db; border: 1px solid #374151; line-height: 1.5;"></div>
      </div>

      <div>
        <label style="display: block; font-size: 14px; color: #9ca3af; margin-bottom: 6px;">新增協作備註：</label>
        <textarea id="notes-page-new-input" rows="4" style="width: 100%; padding: 10px; background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px;" placeholder="在此輸入新備註（將自動記錄帳號與時間）..."></textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px;">
        <button onclick="window.goBackToMainFromNotes()" style="padding: 10px 20px; background: #4b5563; color: #fff; border: none; border-radius: 6px; cursor: pointer;">取消返回</button>
        <button onclick="window.saveNewNoteAndReturn()" style="padding: 10px 24px; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: bold;">送出備註並返回主頁</button>
      </div>
    </div>
  </div>

</body>
</html>
