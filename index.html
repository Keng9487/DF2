<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="pageTitle">Dead Frontier 2 互動地圖 & Supabase 即時共享 HUD 系統</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 語言下拉選單黑色背景樣式（與高樓頁面保持一致） */
    .lang-select {
      background-color: #000000;
      color: #f3f4f6;
      border: 1px solid #4b5563;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }
    .lang-select option {
      background-color: #000000;
      color: #f3f4f6;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand" data-i18n="navBrand">🗺️ 遊戲任務與高樓系統</div>
    <div class="nav-links" style="display: flex; align-items: center; gap: 12px;">
      <a href="index.html" class="nav-link active" id="nav-index" data-i18n="navIndex">主頁與地圖</a>
      <a href="高樓.html" class="nav-link" id="nav-building" data-i18n="navBuilding">高樓資訊頁</a>
      <!-- 語言切換下拉選單 -->
      <select id="langSelect" class="lang-select" onchange="window.switchLanguage && window.switchLanguage(this.value)">
        <option value="zh-TW">繁體中文</option>
        <option value="zh-CN">简体中文</option>
      </select>
    </div>
  </nav>

  <header style="display: flex; justify-content: space-between; align-items: center; background: #1a202c; padding: 10px 20px; color: white;">
    <div style="display: flex; align-items: center; gap: 15px;">
      <span id="user-name-display" style="font-size: 14px; color: #cbd5e0;" data-i18n="notLoggedIn">未登入</span>
      <div id="auth-buttons-container">
        <a href="登入.html" data-i18n="loginBtn" style="padding: 6px 12px; background: #3182ce; color: white; text-decoration: none; border-radius: 4px; margin-right: 5px;">登入</a>
        <a href="註冊.html" data-i18n="registerBtn" style="padding: 6px 12px; background: #38a169; color: white; text-decoration: none; border-radius: 4px;">註冊</a>
      </div>
    </div>
    <h1 style="margin: 0; font-size: 18px;" data-i18n="headerTitle">Dead Frontier 2 互動地圖</h1>
  </header>

  <div class="main-layout">
    <div class="panel-box">
      <div class="panel-title" data-i18n="hudPanelTitle">📜 Mission HUD Table</div>
      <div class="controls-row">
        <input type="text" id="search" class="search-box" data-i18n-placeholder="searchPlaceholder" placeholder="🔍 搜尋建築、城市、任務類型或備註..." oninput="filterQuests()">
        <div class="filters-group">
          <!-- 城市複選下拉選單 -->
          <div class="filter-item" style="position: relative;">
            <label style="font-size: 13px; color: #cbd5e0;" data-i18n="filterCityLabel">城市:</label>
            <div class="custom-dropdown" id="dropdown-city">
              <button type="button" class="dropdown-toggle" onclick="toggleDropdown('city')" style="background: #1f2937; color: #fff; border: 1px solid #4b5563; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; width: 130px; text-align: left; display: flex; justify-content: space-between; align-items: center;">
                <span id="city-toggle-text" data-i18n="allCities">全部城市</span> <span>▼</span>
              </button>
              <div class="dropdown-panel" id="panel-city" style="display: none; position: absolute; top: 100%; left: 0; z-index: 100; background: #1f2937; border: 1px solid #4b5563; border-radius: 4px; padding: 8px; width: max-content; min-width: 140px; max-width: 300px; max-height: 400px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <!-- 動態載入 Checkbox 選項 -->
              </div>
            </div>
          </div>

          <!-- 任務類型複選下拉選單 -->
          <div class="filter-item" style="position: relative;">
            <label style="font-size: 13px; color: #cbd5e0;" data-i18n="filterTypeLabel">類型:</label>
            <div class="custom-dropdown" id="dropdown-type">
              <button type="button" class="dropdown-toggle" onclick="toggleDropdown('type')" style="background: #1f2937; color: #fff; border: 1px solid #4b5563; padding: 6px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; width: 130px; text-align: left; display: flex; justify-content: space-between; align-items: center;">
                <span id="type-toggle-text" data-i18n="allTypes">全部類型</span> <span>▼</span>
              </button>
              <div class="dropdown-panel" id="panel-type" style="display: none; position: absolute; top: 100%; left: 0; z-index: 100; background: #1f2937; border: 1px solid #4b5563; border-radius: 4px; padding: 8px; width: max-content; min-width: 140px; max-width: 300px; max-height: 400px; overflow-y: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
                <!-- 動態載入 Checkbox 選項 -->
              </div>
            </div>
          </div>

          <div class="filter-item">
            <label for="filter-status" data-i18n="filterStatusLabel">狀態:</label>
            <select id="filter-status" onchange="filterQuests()">
              <option value="" data-i18n="statusAll">全部狀態</option>
              <option value="pending" data-i18n="statusPending">⭕ 未完成</option>
              <option value="show" data-i18n="statusShow">👁️ 顯示中</option>
              <option value="completed" data-i18n="statusCompleted">✅ 已完成</option>
            </select>
          </div>

          <!-- 地圖顯示開關與自選顏色控制組 -->
          <div class="controls-row" style="display: flex; gap: 12px; margin-bottom: 10px; align-items: center; flex-wrap: wrap;">
            <!-- ⭕ 未完成任務控制 -->
            <div class="filter-item" style="display: flex; align-items: center; gap: 5px;">
              <label for="toggle-pending-vis" style="font-size: 13px; color: #cbd5e0;" data-i18n="visPendingLabel">⭕ 未完成:</label>
              <select id="toggle-pending-vis" onchange="updateMapHighlights()" style="background: #1f2937; color: #fff; border: 1px solid #4b5563; padding: 4px; border-radius: 4px; font-size: 12px;">
                <option value="show" selected data-i18n="optShow">顯示</option>
                <option value="hide" data-i18n="optHide">隱藏</option>
              </select>
              <input type="color" id="picker-pending" value="#ef4444" title="選擇未完成任務方塊顏色" style="cursor: pointer; border: none; background: none; width: 26px; height: 26px; padding: 0; vertical-align: middle;">
            </div>

            <!-- 👁️ 顯示中任務控制 -->
            <div class="filter-item" style="display: flex; align-items: center; gap: 5px;">
              <label for="picker-show" style="font-size: 13px; color: #cbd5e0;" data-i18n="visShowLabel">👁️ 顯示中:</label>
              <input type="color" id="picker-show" value="#3b82f6" title="選擇顯示中任務方塊顏色" style="cursor: pointer; border: none; background: none; width: 26px; height: 26px; padding: 0; vertical-align: middle;">
            </div>

            <!-- ✅ 已完成任務控制 -->
            <div class="filter-item" style="display: flex; align-items: center; gap: 5px;">
              <label for="toggle-completed-vis" style="font-size: 13px; color: #cbd5e0;" data-i18n="visCompletedLabel">✅ 已完成:</label>
              <select id="toggle-completed-vis" onchange="updateMapHighlights()" style="background: #1f2937; color: #fff; border: 1px solid #4b5563; padding: 4px; border-radius: 4px; font-size: 12px;">
                <option value="show" selected data-i18n="optShow">顯示</option>
                <option value="hide" data-i18n="optHide">隱藏</option>
              </select>
              <input type="color" id="picker-completed" value="#10b981" title="選擇已完成任務方塊顏色" style="cursor: pointer; border: none; background: none; width: 26px; height: 26px; padding: 0; vertical-align: middle;">
            </div>

            <!-- 🎯 點擊鎖定控制 -->
            <div class="filter-item" style="display: flex; align-items: center; gap: 5px;">
              <label for="picker-locked" style="font-size: 13px; color: #cbd5e0;" data-i18n="visLockedLabel">🎯 鎖定:</label>
              <input type="color" id="picker-locked" value="#f6ad55" title="選擇點擊鎖定/定位方塊顏色" style="cursor: pointer; border: none; background: none; width: 26px; height: 26px; padding: 0; vertical-align: middle;">
            </div>
          </div>

          <button class="btn-action" style="margin-left: auto;" onclick="resetFilters()" data-i18n="resetFiltersBtn">重設篩選</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="hud-table" id="missionTable">
          <thead>
            <tr style="border-bottom: 2px solid #374151; text-align: left; color: #9ca3af;">
              <th class="sortable" data-sort="building" onclick="window.sortTable('building')" style="padding: 10px; cursor: pointer; user-select: none;">
                <span data-i18n="thBuilding">任務建築</span> <span class="sort-icon">↕️</span>
              </th>
              <th class="sortable" data-sort="city" onclick="window.sortTable('city')" style="padding: 10px; cursor: pointer; user-select: none;">
                <span data-i18n="thCity">任務城市</span> <span class="sort-icon">↕️</span>
              </th>
              <th class="sortable" data-sort="task_type" onclick="window.sortTable('task_type')" style="padding: 10px; cursor: pointer; user-select: none;">
                <span data-i18n="thType">任務類型</span> <span class="sort-icon">↕️</span>
              </th>
              <th style="padding: 10px;" data-i18n="thNotes">備註</th>
              <th style="padding: 10px;" data-i18n="thEdit">編輯</th>
              <th class="sortable" data-sort="status" onclick="window.sortTable('status')" style="padding: 10px; cursor: pointer; user-select: none;">
                <span data-i18n="thStatus">狀態</span> <span class="sort-icon">↕️</span>
              </th>
            </tr>
          </thead>
          <tbody id="hudTableBody">
            <tr>
              <td colspan="6" style="text-align: center; color: #8b949e; padding: 20px;" data-i18n="loadingQuests">載入任務資料中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel-box map-section">
      <div class="panel-title" data-i18n="mapPanelTitle">🗺️ 互動地圖繪製與鎖定</div>
      <div class="map-wrapper">
        <svg id="map-svg" class="map-svg-layer"></svg>
        <table id="map-table" class="map-table"></table>
      </div>
      <div id="info-panel">
        <div id="panel-msg" data-i18n="panelDefaultMsg">點擊左側任務列可<b>選擇指定同名點位進行鎖定</b></div>
        <div id="panel-details" style="margin-top: 6px;"></div>
      </div>
    </div>
  </div>

  <script type="module" src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth-state.js"></script>
</body>
</html>
