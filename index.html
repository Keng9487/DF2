<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Frontier 2 互動地圖 & Supabase 即時共享 HUD 系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; background: #1a202c; padding: 10px 20px; color: white;">
  
    <!-- 🔥 移到左側：使用者名稱與登入/註冊/登出按鈕區塊 -->
    <div style="display: flex; align-items: center; gap: 15px;">
      <!-- 顯示玩家名稱的 ID -->
      <span id="user-name-display" style="font-size: 14px; color: #cbd5e0;">未登入</span>
      
      <!-- 放置按鈕的容器 ID -->
      <div id="auth-buttons-container">
        <a href="登入.html" style="padding: 6px 12px; background: #3182ce; color: white; text-decoration: none; border-radius: 4px; margin-right: 5px;">登入</a>
        <a href="register.html" style="padding: 6px 12px; background: #38a169; color: white; text-decoration: none; border-radius: 4px;">註冊</a>
      </div>
    </div>

    <!-- 右側可以放你的網站標題或其他選單 -->
    <h1 style="margin: 0; font-size: 18px;">Dead Frontier 2 互動地圖</h1>
  </header>

  <div class="main-layout">
    
    <div class="panel-box">
      <div class="panel-title">📜 Mission HUD Table</div>

      <div class="controls-row">
        <input type="text" id="search" class="search-box" placeholder="🔍 搜尋建築、城市、任務類型或備註..." oninput="filterQuests()">
        
        <div class="filters-group">
          <div class="filter-item">
            <label for="filter-city">城市:</label>
            <select id="filter-city" onchange="filterQuests()">
              <option value="">全部城市</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="filter-type">類型:</label>
            <select id="filter-type" onchange="filterQuests()">
              <option value="">全部類型</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="filter-status">狀態:</label>
            <select id="filter-status" onchange="filterQuests()">
              <option value="">全部狀態</option>
              <option value="pending">⭕ 未完成</option>
              <option value="show">👁️ 顯示中</option>
              <option value="completed">✅ 已完成</option>
            </select>
          </div>

          <div class="filter-item" style="margin-left: 8px;">
            <label for="toggle-pending-vis">未完成點位:</label>
            <select id="toggle-pending-vis" onchange="updateMapHighlights()">
              <option value="show" selected>👁️ 顯示</option>
              <option value="hide">🙈 隱藏</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="pending-color-picker">顏色:</label>
            <input type="color" id="pending-color-picker" value="#ff9800" onchange="updatePendingColor(this.value)">
          </div>

          <div class="filter-item" style="margin-left: 8px;">
            <label for="toggle-completed-vis">已完成點位:</label>
            <select id="toggle-completed-vis" onchange="updateMapHighlights()">
              <option value="show" selected>👁️ 顯示</option>
              <option value="hide">🙈 隱藏</option>
            </select>
          </div>

          <div class="filter-item">
            <label for="completed-color-picker">顏色:</label>
            <input type="color" id="completed-color-picker" value="#4caf50" onchange="updateCompletedColor(this.value)">
          </div>

          <button class="btn-action" style="margin-left: auto;" onclick="resetFilters()">重設篩選</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="hud-table" id="missionTable">
          <thead>
            <tr>
              <th onclick="sortTable(0)">任務建築 <span class="sort-icon"></span></th>
              <th onclick="sortTable(1)">任務城市 <span class="sort-icon"></span></th>
              <th onclick="sortTable(2)">任務類型 <span class="sort-icon"></span></th>
              <th onclick="sortTable(3)">備註 <span class="sort-icon"></span></th>
              <th onclick="sortTable(4)">狀態 <span class="sort-icon"></span></th>
            </tr>
          </thead>
          <tbody id="hudTableBody">
            <tr>
              <td colspan="5" style="text-align: center; color: #8b949e; padding: 20px;">載入任務資料中...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="panel-box map-section">
      <div class="panel-title">🗺️ 互動地圖繪製與鎖定</div>
      
      <div class="map-wrapper">
        <svg id="map-svg" class="map-svg-layer"></svg>
        <table id="map-table" class="map-table"></table>
      </div>

      <div id="info-panel">
        <div id="panel-msg">點擊左側任務列可<b>選擇指定同名點位進行鎖定</b>；點擊地圖格子可開始畫線...</div>
        <div id="panel-details" style="margin-top: 6px;"></div>
      </div>
    </div>

  </div>

  <script type="module" src="index.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth-state.js"></script>
</body>
</html>
