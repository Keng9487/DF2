<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dead Frontier 2 互動地圖 & Firebase 即時共享系統</title>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD6iCrgLn-5yh4bE4zudbaZ-lbzt4m-37w",
      authDomain: "df2-mission-system.firebaseapp.com",
      databaseURL: "https://df2-mission-system-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "df2-mission-system",
      storageBucket: "df2-mission-system.firebasestorage.app",
      messagingSenderId: "950389132060",
      appId: "1:950389132060:web:2577b9cb0724cb6c9388d9"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    // ⚠️ 修改點 1: 確保與 Python 爬蟲上傳的集合名稱一致 ('missions')
    window.COL_QUESTS = "task";
    window.COL_MAP = "map";
    window.FirebaseTools = { collection, addDoc, updateDoc, doc, onSnapshot };
    
    initApp();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "Segoe UI", Arial, sans-serif; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; padding: 20px; background: #121212; }
    header { margin-bottom: 20px; text-align: center; }
    header h1 { font-size: 2rem; color: #4caf50; }
    .container { display: flex; gap: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
    
    .sidebar { flex: 1; max-width: 380px; background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(8px); border: 1px solid #333; padding: 15px; border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
    .sidebar h2 { font-size: 1.2rem; color: #ff9800; }
    
    .form-group { display: flex; flex-direction: column; gap: 6px; background: #1a1a1a; padding: 10px; border-radius: 6px; border: 1px solid #444; }
    .form-group input { width: 100%; padding: 8px; background: #121212; border: 1px solid #555; border-radius: 4px; color: #fff; outline: none; font-size: 0.85rem; }
    .form-group input:focus { border-color: #4caf50; }
    .btn-add { background: #4caf50; color: #fff; border: none; padding: 8px; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
    .btn-add:hover { background: #45a049; }

    .search-box { width: 100%; padding: 10px; background: #121212; border: 1px solid #444; border-radius: 4px; color: #fff; outline: none; }
    .search-box:focus { border-color: #ff9800; }
    
    .quest-list { flex: 1; max-height: 320px; overflow-y: auto; padding-right: 5px; }
    
    .quest-card { background: #262626; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 4px solid #ff9800; transition: all 0.2s ease; }
    .quest-card.active { background: #3a2e1b; border-left-color: #ff5722; }
    .quest-card.near-route { border-left-color: #03a9f4; background: #1a2a3a; }
    .quest-card h3 { font-size: 0.95rem; color: #fff; margin-bottom: 4px; cursor: pointer; }
    .quest-meta { font-size: 0.8rem; color: #aaa; line-height: 1.4; margin-bottom: 8px; }
    
    .note-box { display: flex; gap: 5px; margin-top: 6px; }
    .note-box input { flex: 1; padding: 5px; background: #121212; border: 1px solid #444; border-radius: 3px; color: #fff; font-size: 0.75rem; }
    .note-box button { padding: 4px 8px; background: #ff9800; border: none; border-radius: 3px; color: #000; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
    .note-box button:hover { background: #e68900; }

    .map-section { flex: 2; display: flex; flex-direction: column; gap: 15px; }
    .map-wrapper { position: relative; background: #000; padding: 0; border: none; overflow: hidden; width: 960px; height: 576px; background-image: url('map_bg.jpg'); background-size: 960px 576px; background-position: top left; background-repeat: no-repeat; }
    
    .map-table { position: absolute; top: 0; left: 0; z-index: 2; border-collapse: collapse; border-spacing: 0; table-layout: fixed; width: 960px; height: 576px; }
    .map-table td { width: 32px; height: 32px; min-width: 32px; max-width: 32px; min-height: 32px; max-height: 32px; padding: 0; margin: 0; border: 1px solid rgba(255, 255, 255, 0.15); background-color: transparent; cursor: pointer; font-size: 10px; text-align: center; color: #fff; font-weight: bold; }
    .map-table td:nth-child(6n) { border-right: 2px solid rgba(255, 255, 255, 0.5); }
    .map-table tr:nth-child(6n) td { border-bottom: 2px solid rgba(255, 255, 255, 0.5); }
    .map-table td:hover { background-color: rgba(255, 255, 255, 0.2); }
    
    .map-svg-layer { position: absolute; top: 0; left: 0; width: 960px; height: 576px; z-index: 1; pointer-events: none; }

    .map-table td.highlight { background-color: rgba(255, 0, 0, 0.5) !important; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6); }
    .map-table td.quest-locked-highlight { background-color: rgba(255, 215, 0, 0.65) !important; box-shadow: inset 0 0 0 2px #fff !important; }
    .map-table td.near-route-highlight { background-color: rgba(3, 169, 244, 0.45) !important; box-shadow: inset 0 0 0 1px #03a9f4 !important; }
    
    .map-table td.custom-line-start {
      box-shadow: inset 0 0 0 3px #ffeb3b !important;
      background-color: rgba(255, 235, 59, 0.3) !important;
    }

    #info-panel { background: rgba(30, 30, 30, 0.85); backdrop-filter: blur(8px); border: 1px solid #333; padding: 15px; border-radius: 8px; min-height: 90px; font-size: 0.9rem; line-height: 1.5; width: 960px; display: flex; flex-direction: column; gap: 8px; }
    #info-panel strong { color: #ff9800; }
    #info-panel ul { margin-top: 5px; padding-left: 20px; }
  </style>
</head>
<body>

  <header>
    <h1>Dead Frontier 2 互動地圖 & Firebase 即時共享系統</h1>
  </header>

  <div class="container">
    <div class="sidebar">
      <h2>📜 任務與即時同步 <span id="sync-status" style="font-size: 0.7rem; color: #4caf50;">(連線中...)</span></h2>

      <div class="form-group">
        <span style="font-size: 0.85rem; color: #4caf50; font-weight: bold;">➕ 新增任務與備註</span>
        <input type="text" id="new-city" placeholder="輸入城市 (例如: Dallbow)">
        <input type="text" id="new-building" placeholder="輸入建築名稱 (例如: Haley Cottage)">
        <input type="text" id="new-type" placeholder="輸入任務類型 (例如: Find Item)">
        <input type="text" id="new-notes" placeholder="初始備註 (選填)">
        <button class="btn-add" onclick="addNewQuest()">確認新增</button>
      </div>

      <input type="text" id="search" class="search-box" placeholder="搜尋建築、城市、任務或備註..." oninput="filterQuests()">
      <div id="quest-list" class="quest-list">載入中...</div>
    </div>

    <div class="map-section">
      <div class="map-wrapper">
        <svg id="map-svg" class="map-svg-layer"></svg>
        <table id="map-table" class="map-table"></table>
      </div>
      <div id="info-panel">
        <div id="panel-msg">請點擊地圖格子以開始畫線 (按住 <b>Shift + 點擊上一個點</b> 可取消路線)...</div>
        <div id="panel-details"></div>
      </div>
    </div>
  </div>

  <script>
    let globalQuestData = [];
    let globalRouteMapData = []; 
    let activeHighlightCoords = new Set();
    let lockedBuildingsSet = new Set(); 
    let nearRouteCoords = new Set(); 

    let actionStartCoord = null; 
    let customLines = []; 

    function cleanBuildingName(name) {
      if (!name) return '';
      return name
        .toLowerCase()
        .replace(/\s*\([^)]*\)/g, '')
        .replace(/[^a-z0-9\u4e00-\u9fa5]/g, '')
        .trim();
    }

    function initApp() {
      const { collection, onSnapshot } = window.FirebaseTools;

      onSnapshot(collection(window.db, window.COL_MAP), (snapshot) => {
        globalRouteMapData = [];
        snapshot.forEach((doc) => {
          const raw = doc.data();
          globalRouteMapData.push({
            x: parseInt(raw["data-xcoord"] || raw.x || 0),
            y: parseInt(raw["data-ycoord"] || raw.y || 0),
            buildings: typeof raw["data-buildings"] === 'string' 
              ? raw["data-buildings"].split(',').map(s => s.trim()).filter(Boolean) 
              : (raw.buildings || [])
          });
        });
        renderMap(globalRouteMapData);
        updateSystemDisplay();
      });

      onSnapshot(collection(window.db, window.COL_QUESTS), (snapshot) => {
        globalQuestData = [];
        snapshot.forEach((doc) => {
          globalQuestData.push({ id: doc.id, ...doc.data() });
        });
        updateSystemDisplay();
        document.getElementById('sync-status').innerText = "(Firebase 即時連線)";
      });
    }

    function renderMap(mapRawData) {
      const tableContainer = document.getElementById('map-table');
      tableContainer.innerHTML = '';

      const nodeMap = new Map();
      mapRawData.forEach(item => nodeMap.set(`${item.x},${item.y}`, item));

      for (let y = 1; y <= 18; y++) {
        const tr = document.createElement('tr');
        for (let x = 1; x <= 30; x++) {
          const td = document.createElement('td');
          td.id = `cell-${x}-${y}`;
          const nodeData = nodeMap.get(`${x},${y}`);

          td.addEventListener('mouseenter', () => displayCoordInfo(nodeData));
          td.addEventListener('click', (e) => handleMapCellClick(x, y, e.shiftKey));

          tr.appendChild(td);
        }
        tableContainer.appendChild(tr);
      }
      updateMapHighlights();
      renderCustomLines();
    }

    function handleMapCellClick(x, y, isDeleteMode) {
      if (!isDeleteMode) {
        if (!actionStartCoord) {
          actionStartCoord = { x, y };
          updateMapHighlights();
          document.getElementById('panel-msg').innerHTML = `<span style="color: #ffeb3b; font-weight: bold;">✏️ 畫線起點設在 (${x}, ${y})。請點擊下一個格子以延伸路線！</span>`;
        } else {
          const x1 = actionStartCoord.x;
          const y1 = actionStartCoord.y;
          const x2 = x;
          const y2 = y;

          customLines.push({ x1, y1, x2, y2 });
          actionStartCoord = { x: x2, y: y2 };

          updateNearRouteCoords();
          updateMapHighlights();
          renderCustomLines();
          renderQuests(globalQuestData);
          document.getElementById('panel-msg').innerHTML = `<span style="color: #4caf50; font-weight: bold;">✏️ 已新增路線，並自動標記周邊 2 格內有任務的建築！</span>`;
        }
      } else {
        if (!actionStartCoord) {
          actionStartCoord = { x, y };
          updateMapHighlights();
          document.getElementById('panel-msg').innerHTML = `<span style="color: #f44336; font-weight: bold;">🗑️ 刪除起點設在 (${x}, ${y})。請點擊要取消的相鄰點！</span>`;
        } else {
          const x1 = actionStartCoord.x;
          const y1 = actionStartCoord.y;
          const x2 = x;
          const y2 = y;

          const initialLength = customLines.length;
          customLines = customLines.filter(line => {
            const matchForward = (line.x1 === x1 && line.y1 === y1 && line.x2 === x2 && line.y2 === y2);
            const matchBackward = (line.x1 === x2 && line.y1 === y2 && line.x2 === x1 && line.y1 === y1);
            return !(matchForward || matchBackward);
          });

          if (customLines.length < initialLength) {
            actionStartCoord = { x: x2, y: y2 };
            updateNearRouteCoords();
            updateMapHighlights();
            renderCustomLines();
            renderQuests(globalQuestData);
            document.getElementById('panel-msg').innerHTML = `<span style="color: #f44336; font-weight: bold;">🗑️ 已取消路線段並更新範圍</span>`;
          } else {
            actionStartCoord = { x, y };
            updateMapHighlights();
            document.getElementById('panel-msg').innerHTML = `<strong>提示</strong>: (${x1},${y1}) 與 (${x2},${y2}) 之間無連線，已將刪除起點改設為 (${x}, ${y})`;
          }
        }
      }
    }

    // 尋找路線附近 2 格內，且「包含任務」的格子
    function updateNearRouteCoords() {
      nearRouteCoords.clear();
      if (customLines.length === 0) return;

      let routePoints = new Set();
      customLines.forEach(line => {
        const minX = Math.min(line.x1, line.x2);
        const maxX = Math.max(line.x1, line.x2);
        const minY = Math.min(line.y1, line.y2);
        const maxY = Math.max(line.y1, line.y2);
        
        for (let x = minX; x <= maxX; x++) {
          for (let y = minY; y <= maxY; y++) {
            routePoints.add(`${x},${y}`);
          }
        }
      });

      // 建立現有任務建築的對照集合
      const questBuildingSet = new Set();
      globalQuestData.forEach(q => {
        if (q.building) questBuildingSet.add(cleanBuildingName(q.building));
      });

      globalRouteMapData.forEach(node => {
        let isNear = false;
        for (let ptStr of routePoints) {
          const [px, py] = ptStr.split(',').map(Number);
          const dist = Math.max(Math.abs(node.x - px), Math.abs(node.y - py));
          if (dist <= 2) {
            isNear = true;
            break;
          }
        }
        
        // 必須同時符合「在路線 2 格內」且「該格子包含任務建築」
        if (isNear && node.buildings && node.buildings.some(b => questBuildingSet.has(cleanBuildingName(b)))) {
          nearRouteCoords.add(`${node.x},${node.y}`);
        }
      });
    }

    function renderCustomLines() {
      const svg = document.getElementById('map-svg');
      svg.innerHTML = ''; 

      customLines.forEach(line => {
        const cx1 = (line.x1 - 1) * 32 + 16;
        const cy1 = (line.y1 - 1) * 32 + 16;
        const cx2 = (line.x2 - 1) * 32 + 16;
        const cy2 = (line.y2 - 1) * 32 + 16;

        const lineEl = document.createElementNS("http://www.w3.org/2000/svg", "line");
        lineEl.setAttribute("x1", cx1);
        lineEl.setAttribute("y1", cy1);
        lineEl.setAttribute("x2", cx2);
        lineEl.setAttribute("y2", cy2);
        lineEl.setAttribute("stroke", "#ffffff"); 
        lineEl.setAttribute("stroke-width", "3");   
        lineEl.setAttribute("stroke-linecap", "round");
        svg.appendChild(lineEl);
      });
    }

    function updateSystemDisplay() {
      activeHighlightCoords.clear();
      const questMapByBuilding = new Map();

      globalQuestData.forEach(q => {
        if (q.building) {
          const cleanKey = cleanBuildingName(q.building);
          if (!questMapByBuilding.has(cleanKey)) questMapByBuilding.set(cleanKey, []);
          questMapByBuilding.get(cleanKey).push(q);
        }
      });

      globalRouteMapData.forEach(node => {
        let hasActive = false;
        if (node.buildings) {
          node.buildings.forEach(bName => {
            const cleanName = cleanBuildingName(bName);
            if (questMapByBuilding.has(cleanName)) {
              const matches = questMapByBuilding.get(cleanName);
              if (matches.some(q => q.active === true)) hasActive = true;
            }
          });
        }
        if (hasActive) activeHighlightCoords.add(`${node.x},${node.y}`);
      });

      updateNearRouteCoords();
      updateMapHighlights();
      renderQuests(globalQuestData);
    }

    function updateMapHighlights() {
      document.querySelectorAll('.map-table td').forEach(td => {
        td.classList.remove('highlight');
        td.classList.remove('quest-locked-highlight');
        td.classList.remove('near-route-highlight');
        td.classList.remove('custom-line-start');
        td.innerText = '';
      });

      activeHighlightCoords.forEach(coordKey => {
        const [x, y] = coordKey.split(',');
        const targetCell = document.getElementById(`cell-${x}-${y}`);
        if (targetCell) targetCell.classList.add('highlight');
      });

      // 渲染附近 2 格內且有任務的格子為淺藍色半透明
      nearRouteCoords.forEach(coordKey => {
        const [x, y] = coordKey.split(',');
        const targetCell = document.getElementById(`cell-${x}-${y}`);
        if (targetCell && !targetCell.classList.contains('highlight')) {
          targetCell.classList.add('near-route-highlight');
        }
      });

      if (lockedBuildingsSet.size > 0) {
        globalRouteMapData.forEach(node => {
          if (node.buildings && node.buildings.some(b => cleanBuildingName(b) && lockedBuildingsSet.has(cleanBuildingName(b)))) {
            const targetCell = document.getElementById(`cell-${node.x}-${node.y}`);
            if (targetCell) targetCell.classList.add('quest-locked-highlight');
          }
        });
      }

      if (actionStartCoord) {
        const startCell = document.getElementById(`cell-${actionStartCoord.x}-${actionStartCoord.y}`);
        if (startCell) startCell.classList.add('custom-line-start');
      }
    }

    function displayCoordInfo(data) {
      const detailsPanel = document.getElementById('panel-details');
      if (!data || !data.buildings || data.buildings.length === 0) {
        detailsPanel.innerHTML = `<strong>位置資訊</strong>: 空地 / 無建築`;
        return;
      }
      let html = `<strong>🏢 建築物：</strong> ${data.buildings.join(', ')}<br>`;
      let matchedQuests = [];
      data.buildings.forEach(bName => {
        const cleanName = cleanBuildingName(bName);
        globalQuestData.forEach(q => {
          if (cleanBuildingName(q.building) === cleanName) matchedQuests.push(q);
        });
      });
      if (matchedQuests.length > 0) {
        html += `<b style="color:#4caf50;">🎯 包含任務與備註：</b><ul>`;
        matchedQuests.forEach(q => {
          const status = q.active ? " (✅ 已完成)" : "";
          const noteText = q.notes ? ` | 📝 備註: <span style="color:#ff9800;">${q.notes}</span>` : "";
          // ⚠️ 修改點 2: 相容 task_type 欄位
          const taskType = q.task_type || q.type || '任務';
          html += `<li><b>${taskType}</b> - 城市: <i>${q.city || '未知'}</i> (建築: ${q.building})${status}${noteText}</li>`;
        });
        html += `</ul>`;
      } else {
        html += `<span style="color:#888;">此區域無當前任務</span>`;
      }
      detailsPanel.innerHTML = html;
    }

    function locateQuestByBuilding(targetBuildingName) {
      if (!targetBuildingName) return;
      const cleanTarget = cleanBuildingName(targetBuildingName);

      if (lockedBuildingsSet.has(cleanTarget)) {
        lockedBuildingsSet.delete(cleanTarget);
        updateMapHighlights();
        document.getElementById('panel-details').innerHTML = `已取消鎖定建築：${targetBuildingName}`;
        return;
      }

      let matchedNodes = [];
      globalRouteMapData.forEach(node => {
        if (node.buildings && node.buildings.some(b => cleanBuildingName(b) === cleanTarget)) {
          matchedNodes.push(node);
        }
      });

      if (matchedNodes.length === 0) {
        alert('地圖資料中找不到此建築名稱！');
        return;
      }

      lockedBuildingsSet.add(cleanTarget);

      let infoHtml = `<strong>🎯 找到 ${matchedNodes.length} 個同名建築：</strong><ul>`;
      matchedNodes.forEach(node => {
        infoHtml += `<li>座標: (${node.x}, ${node.y}) - 建築: ${node.buildings.join(', ')}</li>`;
      });
      infoHtml += `</ul>`;

      document.getElementById('panel-details').innerHTML = infoHtml;
      updateMapHighlights();
    }

    function isQuestNearRoute(questBuilding) {
      if (!questBuilding || customLines.length === 0) return false;
      const cleanQBuilding = cleanBuildingName(questBuilding);
      
      for (let coordStr of nearRouteCoords) {
        const [x, y] = coordStr.split(',').map(Number);
        const node = globalRouteMapData.find(n => n.x === x && n.y === y);
        if (node && node.buildings) {
          if (node.buildings.some(b => cleanBuildingName(b) === cleanQBuilding)) {
            return true;
          }
        }
      }
      return false;
    }

    function renderQuests(quests) {
      const questListContainer = document.getElementById('quest-list');
      questListContainer.innerHTML = '';
      if (!quests || quests.length === 0) {
        questListContainer.innerHTML = '<div style="color:#888;">目前沒有任務資料</div>';
        return;
      }
      quests.forEach(q => {
        const safeBuildingName = (q.building || '').replace(/'/g, "\\'");
        const isNear = isQuestNearRoute(q.building);

        // ⚠️ 修改點 3: 相容 task_type 欄位
        const taskType = q.task_type || q.type || '任務';

        const card = document.createElement('div');
        card.className = `quest-card ${q.active ? 'active' : ''} ${isNear ? 'near-route' : ''}`;
        card.innerHTML = `
          <h3 style="cursor: pointer; color: ${isNear ? '#03a9f4' : '#4caf50'};" onclick="locateQuestByBuilding('${safeBuildingName}')">
            📌 ${taskType} ${isNear ? ' 🌟(路線周邊2格)' : ''} ${q.active ? '(v 已完成)' : ''}
          </h3>
          <div class="quest-meta">
            🏢 建築: <b>${q.building}</b><br>
            🏙️ 城市: ${q.city || '未知'}
          </div>
          <div class="note-box">
            <input type="text" id="note-input-${q.id}" value="${q.notes || ''}" placeholder="輸入備註...">
            <button onclick="saveNote('${q.id}')">儲存</button>
          </div>
          <div style="margin-top: 6px; display: flex; justify-content: space-between; align-items: center;">
            <button style="background: #333; color: #ff9800; border: 1px solid #555; padding: 3px 8px; border-radius: 3px; cursor: pointer; font-size: 0.75rem;" onclick="toggleQuestActive('${q.id}', ${!q.active})">
              ${q.active ? '↩️ 未完成' : '✅ 已完成'}
            </button>
            <span style="font-size: 0.7rem; color: #ff9800; cursor: pointer;" onclick="locateQuestByBuilding('${safeBuildingName}')">📍 鎖定地圖</span>
          </div>
        `;
        questListContainer.appendChild(card);
      });
    }

    async function toggleQuestActive(docId, newState) {
      const { doc, updateDoc } = window.FirebaseTools;
      try {
        await updateDoc(doc(window.db, window.COL_QUESTS, docId), { active: newState });
      } catch (err) { console.error(err); }
    }

    async function saveNote(docId) {
      const inputEl = document.getElementById(`note-input-${docId}`);
      if (!inputEl) return;
      const { doc, updateDoc } = window.FirebaseTools;
      try {
        await updateDoc(doc(window.db, window.COL_QUESTS, docId), { notes: inputEl.value.trim() });
        alert('備註已同步！');
      } catch (err) { console.error(err); }
    }

    async function addNewQuest() {
      const city = document.getElementById('new-city').value.trim();
      const building = document.getElementById('new-building').value.trim();
      const task_type = document.getElementById('new-type').value.trim();
      const notes = document.getElementById('new-notes').value.trim();
      if (!building || !task_type) { alert('請填寫建築與任務類型'); return; }
      const { collection, addDoc } = window.FirebaseTools;
      try {
        // ⚠️ 修改點 4: 手動新增時同步寫入 task_type 欄位
        await addDoc(collection(window.db, window.COL_QUESTS), { city, building, task_type, notes, active: false });
        alert('新增成功！');
      } catch (err) { console.error(err); }
    }

    function filterQuests() {
      const query = document.getElementById('search').value.toLowerCase().trim();
      const filtered = globalQuestData.filter(q => 
        (q.building || '').toLowerCase().includes(query) || 
        (q.city || '').toLowerCase().includes(query) || 
        (q.task_type || q.type || '').toLowerCase().includes(query) || 
        (q.notes || '').toLowerCase().includes(query)
      );
      renderQuests(filtered);
    }
  </script>
</body>
</html>
