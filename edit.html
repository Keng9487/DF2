<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>編輯與新增路線備註 - Dead Frontier 2 地圖系統</title>
</head>
<body style="background: #1a202c; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

  <div style="background: #2d3748; padding: 30px; border-radius: 8px; width: 450px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    
    <!-- 🔥 動態 Header：顯示 前往{變數1},城市:{變數2} 目標:{變數3} -->
    <h2 id="task-header" style="margin-top: 0; text-align: center; color: #f7fafc; font-size: 16px; line-height: 1.5; margin-bottom: 25px;">
      載入任務資訊中...
    </h2>
    
    <form id="edit-form">
      <!-- 變數對應：新增路線輸入框 -->
      <div style="margin-bottom: 15px;">
        <label for="route-input" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">新增路線</label>
        <input 
          type="text" 
          id="route-input" 
          placeholder="請輸入要新增的路線內容..." 
          required 
          style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;" 
        />
      </div>

      <!-- 貢獻者 (Credits) 欄位：自動帶入且唯讀 -->
      <div style="margin-bottom: 20px;">
        <label for="credits" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">貢獻者 (Credits)</label>
        <input 
          type="text" 
          id="credits" 
          readonly 
          style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; color: #a0aec0; border: 1px solid #4a5568; border-radius: 4px; cursor: not-allowed;" 
        />
        <small style="color: #718096; font-size: 11px; margin-top: 3px; display: block;">由系統自動帶入您的登入名稱。</small>
      </div>

      <!-- 儲存備註按鈕 -->
      <button type="submit" style="width: 100%; padding: 10px; background: #3182ce; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">儲存備註</button>
    </form>

    <div id="edit-message" style="margin-top: 15px; font-size: 14px; text-align: center;"></div>

    <div style="margin-top: 20px; text-align: center; font-size: 13px;">
      <a href="index.html" style="color: #63b3ed; text-decoration: none;">← 返回地圖主頁</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="edit.js"></script>
</body>
</html>
