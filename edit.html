<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>新增路線備註 - Dead Frontier 2 地圖系統</title>
</head>
<body style="background: #1a202c; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

  <div style="background: #2d3748; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    <h2 style="margin-top: 0; text-align: center; color: #f7fafc;">新增路線備註</h2>
    
    <form id="edit-form">
      <!-- 路線 / 備註輸入框 (對應 task 表的 notes) -->
      <div style="margin-bottom: 15px;">
        <label for="task-notes" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">路線與備註內容</label>
        <textarea id="task-notes" rows="4" placeholder="請輸入路線說明、物資點或注意事項..." required style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px; resize: vertical;"></textarea>
      </div>

      <!-- 貢獻者 (Credits) 欄位：自動帶入且唯讀 -->
      <div style="margin-bottom: 20px;">
        <label for="credits" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">貢獻者 (Credits)</label>
        <input 
          type="text" 
          id="credits" 
          readonly 
          style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; color: #a0aec0; border: 1px solid #4a5568; border-radius: 4px; cursor: not-allowed;" 
        />
        <small style="color: #718096; font-size: 11px; margin-top: 3px; display: block;">由系統自動帶入您的登入名稱。</small>
      </div>

      <button type="submit" style="width: 100%; padding: 10px; background: #3182ce; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">儲存備註</button>
    </form>

    <div id="edit-message" style="margin-top: 15px; font-size: 14px; text-align: center;"></div>

    <div style="margin-top: 20px; text-align: center; font-size: 13px;">
      <a href="index.html" style="color: #63b3ed; text-decoration: none;">← 返回地圖主頁</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="edit.js"></script>
</body>
</html>
