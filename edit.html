<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>編輯地圖標記 - Dead Frontier 2 互動地圖</title>
</head>
<body style="background: #1a202c; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif;">

  <div style="background: #2d3748; padding: 30px; border-radius: 8px; width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">
    <h2 style="margin-top: 0; text-align: center; color: #f7fafc;">編輯地圖標記</h2>
    
    <!-- 編輯表單 -->
    <form id="edit-form">
      
      <!-- 標記名稱 -->
      <div style="margin-bottom: 15px;">
        <label for="marker-title" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">標記名稱 / 地點</label>
        <input type="text" id="marker-title" placeholder="例如：保險箱位置、商人、Boss" required style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;" />
      </div>

      <!-- 標記類別 -->
      <div style="margin-bottom: 15px;">
        <label for="marker-category" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">類別</label>
        <select id="marker-category" style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px;">
          <option value="loot">物資 / 搜刮點</option>
          <option value="merchant">商人</option>
          <option value="boss">Boss 重新生點</option>
          <option value="safezone">安全區</option>
        </select>
      </div>

      <!-- 詳細描述 -->
      <div style="margin-bottom: 15px;">
        <label for="marker-desc" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">詳細描述 / 備註</label>
        <textarea id="marker-desc" rows="3" placeholder="輸入相關備註..." style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; border: 1px solid #4a5568; color: white; border-radius: 4px; resize: vertical;"></textarea>
      </div>

      <!-- 🔥 貢獻者 (Credits) 欄位：自動帶入且設為唯讀不可更改 -->
      <div style="margin-bottom: 20px;">
        <label for="credits" style="display: block; margin-bottom: 5px; font-size: 14px; color: #e2e8f0;">貢獻者 (Credits)</label>
        <input 
          type="text" 
          id="credits" 
          readonly 
          style="width: 100%; padding: 8px; box-sizing: border-box; background: #1a202c; color: #a0aec0; border: 1px solid #4a5568; border-radius: 4px; cursor: not-allowed;" 
        />
        <small style="color: #718096; font-size: 11px; margin-top: 3px; display: block;">此欄位由系統自動帶入您的登入名稱，無法手動修改。</small>
      </div>

      <!-- 送出按鈕 -->
      <button type="submit" style="width: 100%; padding: 10px; background: #3182ce; color: white; border: none; font-weight: bold; border-radius: 4px; cursor: pointer;">儲存標記</button>
    </form>

    <!-- 訊息提示區 -->
    <div id="edit-message" style="margin-top: 15px; font-size: 14px; text-align: center;"></div>

    <!-- 返回主頁連結 -->
    <div style="margin-top: 20px; text-align: center; font-size: 13px;">
      <a href="index.html" style="color: #63b3ed; text-decoration: none;">← 放棄編輯並返回地圖主頁</a>
    </div>
  </div>

  <!-- 引入 JavaScript 依賴 (依序載入) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="edit.js"></script>
</body>
</html>
