<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>登入系統</title>
</head>
<body style="background: #111827; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh;">

  <div style="background: #1f2937; padding: 30px; border-radius: 8px; width: 300px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    <h2>系統登入</h2>
    
    <div style="margin-bottom: 15px;">
      <label style="display: block; font-size: 14px; margin-bottom: 5px;">Email</label>
      <input type="email" id="emailInput" style="width: 100%; padding: 8px; background: #374151; border: 1px solid #4b5563; color: #fff; border-radius: 4px;">
    </div>

    <div style="margin-bottom: 15px;">
      <label style="display: block; font-size: 14px; margin-bottom: 5px;">密碼</label>
      <input type="password" id="passwordInput" style="width: 100%; padding: 8px; background: #374151; border: 1px solid #4b5563; color: #fff; border-radius: 4px;">
    </div>

    <button id="loginBtn" style="width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">登入</button>

    <div id="errorMsg" style="margin-top: 15px; font-size: 13px; text-align: center;"></div>
  </div>

  <!-- 務必宣告 type="module" 才能使用 import -->
  <script type="module" src="登入.js"></script>
</body>
</html>
